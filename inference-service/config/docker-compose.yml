# Production deployment (Linux + NVIDIA GPU, e.g. a Grace Hopper GH200 with
# 96GB VRAM) — the vLLM SIDECARS ONLY:
#
#   - vllm-chat      : vLLM serving the chat/analysis model, OpenAI-compatible API.
#   - vllm-embedding : vLLM serving the embedding model, OpenAI-compatible API.
#
# Lives in inference-service/config/ — deliberately OUTSIDE inference-service/app/
# (the FastAPI app's own code + its own Docker config, app/config/docker-compose.yml)
# so the two stacks are started/stopped independently: reloading or redeploying
# the app must never touch these GPU processes (which take a while to load a
# model), and a sidecar restart/crash must never take the API down with it.
# The app reaches these two services over the HOST's published ports (8001,
# 8002 below), not a shared Docker network — see app/config/docker-compose.yml
# for how. On the target Linux host, this whole inference-service/ tree is
# deployed to /srv/StructAI (so this file's own directory is /srv/StructAI/config/).
#
# Both vLLM services use the OFFICIAL `vllm/vllm-openai` image — no hand-rolled
# CUDA Dockerfile to build or maintain. The app never imports vllm; see
# app/services/inference_client.py.
#
# Adjust model names, --gpu-memory-utilization, and --max-model-len once the
# real model sizes are settled against the 96GB of VRAM available (see
# qwen3.8-27b.yaml / qwen3-embedding.yaml, alongside this file — the --config
# files referenced below). If a single GPU can't comfortably host both models
# at once, split them across GPUs with CUDA_VISIBLE_DEVICES /
# `deploy.resources.reservations.devices.device_ids`.
#
# Start/stop independently (run from inference-service/, either order):
#   docker compose -f config/docker-compose.yml up -d              # sidecars
#   docker compose -f config/docker-compose.yml down
#   docker compose -f app/config/docker-compose.yml up -d --build   # app
#   docker compose -f app/config/docker-compose.yml down

# Explicit project name: both this file and app/config/docker-compose.yml
# now sit in a directory literally called `config`, which Compose would
# otherwise use to derive the (identical, colliding) default project name for
# both stacks — collapsing their networks/volumes into one namespace even
# though they're meant to be fully independent.
name: inference-service-sidecars

services:
  vllm-chat:
    image: docker-proxy-dockerhub.artifactory.mycloud.intrabpce.fr/vllm/vllm-openai:qwen38-arm64-cu130
    container_name: vllm-chat
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8001:8000"
    environment:
    #  - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - TMPDIR=/srv/tmp
      - VLLM_USE_MODELSCOPE=0
      - TRANSFORMERS_OFFLINE=1   # empêche tout appel HuggingFace pendant le chargement
      - HF_DATASETS_OFFLINE=1
    volumes:
      - /srv/CA.pem:/etc/ssl/certs/ca-certificates.crt
      - ~/.cache/huggingface:/root/.cache/huggingface
      - /srv/models:/models
      - ./qwen3.8-27b.yaml:/configs/qwen3.8-27b.yaml:ro
    command: --config /configs/qwen3.8-27b.yaml
    restart: unless-stopped

  vllm-embedding:
    image: docker-proxy-dockerhub.artifactory.mycloud.intrabpce.fr/vllm/vllm-openai:qwen38-arm64-cu130
    container_name: vllm-embedding
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    ipc: host
    ports:
      - "8002:8000"
    environment:
    #  - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - TMPDIR=/srv/tmp
    volumes:
      - /srv/CA.pem:/etc/ssl/certs/ca-certificates.crt
      - ~/.cache/huggingface:/root/.cache/huggingface
      - /srv/models:/models
      - ./qwen3-embedding.yaml:/configs/qwen3-embedding.yaml:ro
    command: --config /configs/qwen3-embedding.yaml
    restart: unless-stopped
    depends_on:
      vllm-chat:
        condition: service_started