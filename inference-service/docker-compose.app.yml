# Production deployment — the FastAPI app ONLY (this service never imports
# vllm; see app/services/inference_client.py). The vLLM sidecars (vllm-chat,
# vllm-embedding) live in their own stack, docker-compose.yml, so the two can
# be started/stopped/redeployed independently — see that file's header for
# the reasoning and the exact commands.
#
# --- How the app reaches the sidecars ---
# This stack does NOT share a Docker network with docker-compose.yml's stack
# (two `docker compose` projects never do, unless explicitly wired together).
# Instead, `app` runs with `network_mode: host` and reaches the sidecars the
# same way a local dev setup does: via localhost + the ports docker-compose.yml
# publishes on the HOST (8001 for vllm-chat, 8002 for vllm-embedding). This
# needs no shared external network, no `depends_on` across files (Compose
# can't express that anyway) — just the sidecar stack's ports already being
# published on this host, in either order relative to the app starting.
# `network_mode: host` is Linux-only, matching this deployment's target.
#
# LLM_MODEL / EMBEDDING_MODEL below MUST match `served_model_name` in the
# vLLM --config files the sidecars run with (qwen3.8-27b.yaml,
# qwen3-embedding.yaml) — vLLM matches a request's "model" field against
# that name, not the on-disk model path.
#
# Start/stop independently of the sidecars:
#   docker compose -f docker-compose.app.yml up -d --build
#   docker compose -f docker-compose.app.yml down

services:
  app:
    build: .
    container_name: inference-service-app
    network_mode: host
    environment:
      PORT: "4001"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@structai.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # host networking => same localhost URLs as a bare-metal dev setup.
      LLM_BASE_URL: "http://localhost:8001/v1"
      LLM_MODEL: "qwen3.8-27b"           # served_model_name in qwen3.8-27b.yaml
      EMBEDDING_BASE_URL: "http://localhost:8002/v1"
      EMBEDDING_MODEL: "qwen3-embedding" # served_model_name in qwen3-embedding.yaml
      DB_PATH: "/data/inference-service.db"
      CHROMA_PATH: "/data/chroma"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
